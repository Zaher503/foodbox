# NVIDIA GPU override (Linux, or Windows with Docker Desktop + WSL2):
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
