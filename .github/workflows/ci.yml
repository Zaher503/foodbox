name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q app
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.gpu.yaml config -q
          docker compose -f compose.yaml -f compose.hub.yaml config -q
      - uses: docker/setup-buildx-action@v3
      # The build needs the private-repo token, so it only runs on pushes to main, never on pull requests
      - name: Build image (no push)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          secrets: |
            gh_token=${{ secrets.PRIVATE_REPO_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
