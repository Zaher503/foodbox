<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" href="/s/assets/icon.svg" type="image/svg+xml">
<script src="/s/assets/share-theme.js"></script>
<title>Recipe</title>
<style>
/* Read-only shared recipe. Same tokens as the app (index.html). Light by default, dark via the switch (data-theme). */
:root{
  color-scheme:light;
  --bg:#f2f2f7;--card:#fff;--fill:rgba(120,120,128,.12);--ink:#1d1d1f;--mute:#636366;--line:rgba(60,60,67,.14);
  --acc:#1a6e50;--accf:#1f7a5a;--glass:rgba(250,250,252,.72);--edge:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f11;--card:#1c1c1f;--fill:rgba(120,120,128,.26);--ink:#f5f5f7;--mute:#a1a1a6;--line:rgba(235,235,245,.12);
  --acc:#52c79a;--glass:rgba(40,40,44,.66);--edge:rgba(255,255,255,.12);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
/* no double-tap zoom (and no tap delay); pinch-zoom still works */
html{touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);letter-spacing:-.005em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.nosteps{padding-bottom:0}
button,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap;min-height:44px}
.btn.pri{background:var(--accf);border-color:transparent;color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,.ing li:focus-visible,.theme:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
main{max-width:720px;margin:0 auto}
.hero{display:block;width:100%;height:clamp(240px,48vh,420px);object-fit:cover;background:var(--fill)}
.intro .txt{padding:0 16px}
.cols{padding:0 16px}
h1{font:700 32px/1.12 var(--display);letter-spacing:-.025em;margin:22px 0 10px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mute);font-size:15px;margin-bottom:18px}
.meta a{color:var(--acc);font-weight:600;text-decoration:none}
.meta a:hover{text-decoration:underline}
.chip{background:var(--fill);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:500;color:var(--ink)}
.times{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line);margin-bottom:22px}
.times div{padding:12px 16px}
.times div+div{border-left:1px solid var(--line)}
.times span{display:block;font-size:12px;color:var(--mute)}
.times b{font:600 18px var(--display)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;color:var(--mute);font-size:15px;margin:0 0 10px}
.stepper{display:inline-flex;align-items:center;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.stepper button{border:0;background:none;width:44px;height:40px;font-size:20px;cursor:pointer;color:var(--acc)}
.stepper button:hover:not(:disabled){background:var(--fill)}
.stepper button:disabled{color:var(--mute);opacity:.4;cursor:default}
.stepper output{min-width:3.2em;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accf);margin:0}
h2{font:600 20px var(--display);letter-spacing:-.01em;margin:28px 0 12px}
.ing{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:0 16px;margin:0;list-style:none}
.ing li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ing li:last-child{border-bottom:0}
.ing li.hd{cursor:default;font-weight:700;color:var(--acc);padding-top:16px}
.ing .am{flex:none;min-width:5.5em;font-weight:600;font-variant-numeric:tabular-nums}
.ing .am:empty{display:none}
.ing li.have{text-decoration:line-through;opacity:.45}
b.q{color:var(--acc);font-weight:600}
ol.st{list-style:none;padding:0;margin:0;counter-reset:s}
ol.st li{counter-increment:s;position:relative;padding:2px 0 2px 42px;min-height:28px;margin:0 0 16px}
ol.st li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accf);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.st li.hd{counter-increment:none;padding:14px 0 0;font-weight:700}
ol.st li.hd::before{display:none}
.nut{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line);margin-top:24px;padding:0 16px}
.nut summary{cursor:pointer;padding:13px 0;font-weight:600}
.nut table{width:100%;border-collapse:collapse;margin-bottom:8px}
.nut td{padding:7px 0;border-top:1px solid var(--line)}
.nut td+td{text-align:right;font-variant-numeric:tabular-nums}
.foot{color:var(--mute);font-size:13px;text-align:center;margin:36px 0 8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--edge)}
.dock .btn{display:block;width:100%;max-width:688px;margin:0 auto;padding:15px;font-size:18px;border-radius:14px}
.theme{position:absolute;z-index:6;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.theme:hover{color:var(--acc)}
.msg{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute)}
.msg b{display:block;color:var(--ink);font:600 22px var(--display);margin-bottom:6px}
.load .hero{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (min-width:760px) and (max-width:959px){main{padding-top:24px}.hero{border-radius:18px}.intro .txt,.cols{padding:0 4px}}
/* desktop: picture beside the title, ingredients in a sticky column beside the directions */
@media (min-width:960px){
  body{padding-bottom:0}
  main{max-width:1120px;padding:48px 40px 24px}
  .intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center;margin-bottom:12px}
  .intro.nopic{grid-template-columns:1fr;max-width:760px}
  .intro .txt{padding:0}
  .hero{height:auto;aspect-ratio:4/3;max-height:460px;border-radius:22px;box-shadow:var(--shadow)}
  h1{font-size:42px;margin-top:0}
  .dock{position:static;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .dock .btn{display:inline-block;width:auto;max-width:none;margin:0;padding:13px 28px;font-size:17px}
  .cols{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:56px;align-items:start;padding:0}
  .cols.one{grid-template-columns:minmax(0,760px)}
  .colA{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;padding:4px 4px 16px;margin:-4px}
  ol.st li{font-size:17px;margin-bottom:20px;line-height:1.55}
  .foot{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.load .hero{animation:none}}
@media (prefers-reduced-transparency:reduce){.dock,.theme{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media print{.dock,.tools,.theme{display:none}body{padding:0}.colA{position:static;max-height:none}}
/* cook mode (same as the app) */
#cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ck-top{display:flex;align-items:center;gap:8px;padding:10px 14px}
.ck-top .ttl{flex:1;min-width:0;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-prog{height:4px;background:var(--line)}
.ck-prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.ck-body{flex:1;min-height:0;display:flex;position:relative}
.ck-step{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y}
.ck-step .n{color:var(--acc);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;margin-bottom:12px}
.ck-step .tx{font-size:var(--ckf,28px);line-height:1.35;max-width:900px}
.ck-ing{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:14px 18px;display:none;z-index:2}
.ck-ing.show{display:block}
.ck-ing h2{margin-top:0}
.ck-i{padding:10px 0;border-bottom:1px solid var(--line);font-size:18px;cursor:pointer}
.ck-hd{padding:14px 0 4px;font-weight:700;font-size:16px;color:var(--acc);border-bottom:1px solid var(--line)}
.ck-i.have{text-decoration:line-through;opacity:.45}
.ck-nav{display:flex;gap:10px;padding:12px 14px}
.ck-nav .btn{flex:1;padding:18px;font-size:20px;border-radius:14px}
.ck-aw{font-size:12px;color:var(--mute);text-align:center;padding-bottom:6px}
.dt .ck-ing{position:static;display:block;width:360px;flex:none;border-left:1px solid var(--line);order:2}
.dt .ck-step{padding:40px 56px}
.dt #ckIngBtn{display:none}
</style>
</head>
<body>
<main id="app" class="load" aria-busy="true"><div class="hero"></div></main>
<script src="/s/assets/kit.js"></script>
<script src="/s/assets/share.js"></script>
</body>
</html>
